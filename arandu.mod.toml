# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares
# it with what the code calls, because `aru doctor` reads the application and
# never opens an installed package.

name = "hyz-is/activitylog"
framework = ">= 0.55"
profiles = ["conventional", "performance"]

[permissions]
# It records and reads its own rows. Nothing leaves the process.
network = false
# It keeps no state outside the database.
filesystem = false
# It runs no other program.
exec = false
# module.go owns the activity_log table, so whoever installs this has to run
# `aru migrate`.
migrations = true
